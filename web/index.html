<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Illustrated Dictionary Reader</title>
    <link rel="stylesheet" href="/styles.css?v=20260916-22" />
  </head>
  <body>
    <main>
      <div class="reader-shell">
        <section id="page-stage" class="page-stage" aria-live="polite">
          <div id="spread" class="spread">
            <div id="pdf-page-left" class="pdf-page pdf-page-left">
              <img id="pdf-image-left" alt="词典左页" />
              <div id="overlays-left" class="overlays"></div>
            </div>
            <div id="pdf-page-right" class="pdf-page pdf-page-right">
              <img id="pdf-image-right" alt="词典右页" />
              <div id="overlays-right" class="overlays"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <nav class="page-nav" aria-label="翻页">
      <button id="previous" class="icon-button" type="button" aria-label="上一页">←</button>
      <label class="page-field">
        <span class="sr-only">页码</span>
        <input id="page-number" type="number" inputmode="numeric" />
        <span id="page-total">/ —</span>
      </label>
      <button id="next" class="icon-button" type="button" aria-label="下一页">→</button>
      <button id="random" class="random-button" type="button" aria-label="随机翻页">随机</button>
    </nav>

    <div class="language-control">
      <div id="language-options" class="language-options" role="menu" hidden></div>
      <button id="export-pdf" class="export-button" type="button" aria-label="导出当前语言 PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" />
        </svg>
      </button>
      <button
        id="language-toggle"
        class="language-picker"
        type="button"
        aria-label="选择翻译语言"
        aria-controls="language-options"
        aria-expanded="false"
      >
        <span id="language-code" class="language-code">DA</span>
        <span id="language-name" class="language-name">Dansk</span>
      </button>
    </div>

    <p id="status" class="sr-only" role="status">加载 PDF 页面</p>

    <template id="entry-template">
      <div class="entry-overlay">
        <button class="source-audio-hit" type="button" aria-label="播放英文发音"></button>
        <button class="translation-tag" type="button" aria-label="播放翻译发音">
          <span class="translation-text"></span>
          <em class="translation-noun-marker" hidden></em>
        </button>
      </div>
    </template>

    <template id="title-template">
      <div class="title-overlay">
        <span class="title-translation"></span>
      </div>
    </template>

    <script type="module" src="/app.js?v=20260916-43"></script>
  </body>
</html>
